services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taino
      POSTGRES_USER: taino
      POSTGRES_PASSWORD: taino
    ports:
      - "5432:5432"
    volumes:
      - taino_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taino -d taino"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taino
      SPRING_DATASOURCE_USERNAME: taino
      SPRING_DATASOURCE_PASSWORD: taino

volumes:
  taino_pg:
