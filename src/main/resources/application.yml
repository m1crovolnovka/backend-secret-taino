server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE:2}
    accept-count: 50
    max-connections: 200
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: taino
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:4}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
      enabled: true
  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api/swagger

taino:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    # Direct Link short name from BotFather (Bot → Mini App). Empty = Main Mini App link t.me/bot?startapp=
    mini-app-short-name: ${TELEGRAM_MINI_APP_SHORT_NAME:}
    init-data-max-age-seconds: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:3600}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mini-app-url: ${MINI_APP_URL:http://localhost:5173}
  # Public API origin (HTTPS) so the bot can register webhook on startup
  public-api-url: ${PUBLIC_API_URL:}
  # AES key material for username/name encryption at rest (defaults to JWT_SECRET)
  pii-secret: ${TAINO_PII_SECRET:}
  imgbb:
    api-key: ${IMGBB_API_KEY:}
    base-url: ${IMGBB_BASE_URL:https://api.imgbb.com}
  scheduler:
    draw-delay-ms: ${SCHEDULER_DRAW_DELAY_MS:30000}
    delivery-delay-ms: ${SCHEDULER_DELIVERY_DELAY_MS:60000}
    archive-delay-ms: ${SCHEDULER_ARCHIVE_DELAY_MS:120000}
    # After delivery date, keep room in DELIVERY this many days, then move to archive (FINISHED)
    archive-after-delivery-days: ${SCHEDULER_ARCHIVE_AFTER_DELIVERY_DAYS:7}
    notify-delay-ms: ${SCHEDULER_NOTIFY_DELAY_MS:20000}

logging:
  level:
    root: INFO
    com.taino: INFO
    org.springframework.security: WARN
